name: Daily reminders
# Notifies each device once a day, from the hour picked in the app. GitHub delays and drops scheduled runs
# (an hourly schedule ran only every 4-5 hours), so it is asked every 10 minutes: the first run at or after
# the chosen hour sends, and the rest of the day's runs see it was sent and stop at once.
# Needs the FIREBASE_SERVICE_ACCOUNT secret. Run it by hand with "force" to test right away.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Send now, whatever the hour
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: node --test tools/tests/*.test.mjs
        if: github.event_name != 'schedule'
      - run: npm ci --prefix tools --no-audit --no-fund
      - run: node tools/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          APP_URL: https://riccardotancredi.github.io/Fretwise/
          FORCE: ${{ inputs.force && '1' || '' }}
